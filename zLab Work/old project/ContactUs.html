<!DOCTYPE html>
<html lang="en">
<head>
    <title>Contact Us</title>
</head>
<body style="background-color: rgb(134, 173, 173);">
    <center>
    <fieldset style="width: 600px; height: auto; background-color: antiquewhite; padding: 20px;">
        <h1>Get in Touch</h1>
        <form onsubmit="return validateForm()">
            <table style="width: 100%;">
                <tr>
                    <td>First Name:</td>
                    <td>
                        <input type="text" id="firstName" 
                               placeholder="Please enter first name..."
                               style="width: 100%; padding: 8px;">
                    </td>
                    <td><span id="firstNameError" style="color: red;"></span></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td>
                        <input type="email" id="email" 
                               placeholder="Please enter email..."
                               style="width: 100%; padding: 8px;">
                    </td>
                    <td><span id="emailError" style="color: red;"></span></td>
                </tr>
                <tr>
                    <td>Subject:</td>
                    <td>
                        <select id="subject" style="width: 100%; padding: 8px;">
                            <option value="">Choose a Topic</option>
                            <option>General Inquiry</option>
                            <option>Technical Support</option>
                            <option>Other</option>
                        </select>
                    </td>
                    <td><span id="subjectError" style="color: red;"></span></td>
                </tr>
                <tr>
                    <td>Message:</td>
                    <td>
                        <textarea id="message" 
                                  placeholder="Please enter query..."
                                  style="width: 100%; height: 100px; padding: 8px;"></textarea>
                    </td>
                    <td><span id="messageError" style="color: red;"></span></td>
                </tr>
                <tr>
                    <td colspan="3" style="text-align: center; padding-top: 20px;">
                        <button type="submit" 
                                style="padding: 10px 30px; background-color: #4CAF50; color: white; border: none;">
                            Submit
                        </button>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
    </center>
    <script src="contact_validation.js"></script>
</body>
</html>
