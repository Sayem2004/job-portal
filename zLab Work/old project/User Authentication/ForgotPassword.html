<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password</title>
</head>
<body style="background-color: rgb(134, 173, 173);">
    <center>
    <fieldset style="width: 400px; height: 250px; background-color: antiquewhite;">
        <h1>Forgot Password</h1>
        <form>
            <table>
                <tr>
                    <td>Enter Phone Number:</td>
                    <td><input type="tel" name="phone"  /></td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center; padding-top: 10px;">
                        <button type="submit">Send Reset Link</button>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align:center; padding-top: 10px;">
                        <a href="login.html" style=" padding:6px 12px; background-color:#4CAF50; color:white; border-radius:4px;">Back to Login</a>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
    </center>
</body>
</html>
