<!DOCTYPE html>
<html lang="en">
<head>
    <title>Job Finder</title>
</head>
<body style="background-color: rgb(134, 173, 173); margin: 0; font-family: Arial, sans-serif;">
    <!-- Navigation Bar -->
    <nav style="background-color: antiquewhite; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto;">
            <div style="font-size: 24px; font-weight: bold; color: #235106;">
                Job Finder
            </div>
            <div>
                <a href="#" style="margin: 0 15px; text-decoration: none; color: #810513;">Home</a>
                <a href="#" style="margin: 0 15px; text-decoration: none; color: #810513;">Find Jobs</a>
                <a href="#" style="margin: 0 15px; text-decoration: none; color: #810513;">About</a>
                <a href="#" style="margin: 0 15px; text-decoration: none; color: #810513;">Contact</a>
                <a href="SignUp.html" style="margin: 0 15px; padding: 8px 20px; background-color: #4CAF50; color: white; border-radius: 4px; text-decoration: none;">Register</a>
                <a href="login.html" style="margin: 0 15px; padding: 8px 20px; background-color: #235106; color: white; border-radius: 4px; text-decoration: none;">Login</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div style="padding: 100px 20px; text-align: center;">
        <h1 style="font-size: 36px; color: #235106; margin-bottom: 20px;">
            Get Your Dream Job
        </h1>
        <p style="font-size: 24px; color: #810513; margin-bottom: 40px;">
            Find the most exciting startup jobs
        </p>

        <!-- Search Form -->
        <div style="max-width: 800px; margin: 0 auto; background-color: antiquewhite; padding: 30px; border-radius: 8px;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <input type="text" 
                       placeholder="Job Title or keyword" 
                       style="padding: 12px; width: 400px; border: 1px solid #ccc; border-radius: 4px;">
                
                <select style="padding: 12px; border: 1px solid #ccc; border-radius: 4px;">
                    <option>Location BD</option>
                    <!-- Add more location options here -->
                </select>
                
                <button style="padding: 12px 30px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
                    Find Job
                </button>
            </div>
        </div>
    </div>

    <!-- Additional Content Section -->
    <div style="background-color: antiquewhite; padding: 40px 20px; margin-top: 50px;">
        <div style="max-width: 1200px; margin: 0 auto; text-align: center;">
            <h2 style="color: #235106; margin-bottom: 30px;">Why Choose Us?</h2>
            <div style="display: flex; justify-content: space-around; gap: 20px;">
                <div style="flex: 1; padding: 20px;">
                    <h3>Latest Job Listings</h3>
                    <p>Fresh opportunities updated daily</p>
                </div>
                <div style="flex: 1; padding: 20px;">
                    <h3>Startup Focus</h3>
                    <p>Connect with innovative companies</p>
                </div>
                <div style="flex: 1; padding: 20px;">
                    <h3>Easy Application</h3>
                    <p>One-click application process</p>
                </div>
            </div>
        </div>
    </div>
