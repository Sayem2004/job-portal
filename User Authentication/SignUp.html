<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signup Form</title>
</head>
<body style="background-color: rgb(134, 173, 173);">
    <center>
        <fieldset style="width: 700px;height: auto; background-color: antiquewhite;">
            <h1>Signup Form</h1>
            <form onsubmit="return validateForm()">
                <table>
                    <tr>
                        <td>First Name:</td>
                        <td><input type="text" name="firstname" id="firstname" /></td>
                        <td><span id="firstNameError" ></span></td>
                    </tr>
                    <tr>
                        <td>Last Name:</td>
                        <td><input type="text" name="lastname" id="lastname" /></td>
                        <td><span id="lastNameError" ></span></td>
                    </tr>
                    <tr>
                        <td>ID:</td>
                        <td><input type="number" name="id" id="id" /></td>
                        <td><span id="idError" ></span></td>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="email" name="email" id="email" /></td>
                        <td><span id="emailError" ></span></td>
                    </tr>
                    <tr>
                        <td>Phone Number:</td>
                        <td><input type="tel" name="phone" id="phone" /></td>
                        <td><span id="phoneError"></span></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password" name="password" id="password" /></td>
                        <td><span id="passwordError" ></span></td>
                    </tr>
                    <tr>
                        <td>Date of Birth:</td>
                        <td><input type="date" name="dob" id="dob" /></td>
                        <td><span id="dobError" ></span></td>
                    </tr>
                    <tr>
                        <td>Gender:</td>
                        <td>
                            <input type="radio" name="gender" value="male" /> Male
                            <input type="radio" name="gender" value="female" /> Female
                            <input type="radio" name="gender" value="other" /> Other
                        </td>
                        <td><span id="genderError" ></span></td>
                    </tr>
                    <tr>
                        <td colspan="3" style="text-align:center;">
                            <button type="submit">Register</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="3" style="text-align:center; padding-top: 10px;">
                        <a href="login.html" style="padding:6px 12px; background-color:#4CAF50; color:white; border-radius:4px;">Back to Login</a>
                        </td>
                    </tr>
                </table>
            </form>
        </fieldset>
    </center>
    <script src="SignUp_Validation.js"></script>

</body>
</html>
