<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login Form</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>
    <div class="nav-links">
        <a href="LandingPage.html" class="btn green">Home</a>
        <a href="SignUp.html" class="btn darkgreen">Signup</a>
    </div>

    <center>
        <fieldset class="login-container">
            <h1>Login Form</h1>
            <form onsubmit="return validateForm()">
                <table>
                    <tr>
                        <td>Phone Number:</td>
                        <td><input type="tel" name="phone" id="phone" /></td>
                        <td><span id="phoneError" class="error-text"></span></td>
                    </tr>
                    <tr>
                        <td>Password:</td>
                        <td><input type="password" name="password" id="password"/></td>
                        <td><span id="passwordError" class="error-text"></span></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align:center;">
                            <button type="submit" class="btn green2">Login</button>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="padding-top: 10px;">
                            <a href="forgotPassword.html" class="btn red">Forgot Password?</a>
                        </td>
                    </tr>
                </table>
            </form>
        </fieldset>
    </center>

    <script src="login_Validation.js"></script>
</body>
</html>
